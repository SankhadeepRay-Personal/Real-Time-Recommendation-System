resources:
  pipelines:
    stream_recommendations_flow:
      name: stream_recommendations_flow
      configuration:
        catalog_name: ${var.catalog}
      libraries:
        - glob:
            include: ../../src/stream_recommendations_flow/bronze/**
      schema: bronze
      continuous: false
      development: false
      photon: true
      channel: CURRENT
      catalog: ${var.catalog}
      serverless: true
      
 
      root_path: ../../src/stream_recommendations_flow
